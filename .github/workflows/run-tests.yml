name: Node.js CI

on:
  push:
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x, 24.x, 26.x]
        vite-version: [6, 7, 8]
        include:
          - vite-version: 6
            vitest-version: 4
          - vite-version: 7
            vitest-version: 5
          - vite-version: 8
            vitest-version: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install vite ${{ matrix.vite-version }}
        run: npm i vite@${{ matrix.vite-version }} vitest@${{ matrix.vitest-version}} --no-save --legacy-peer-deps

      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: npm-debug-logs
          path: /home/runner/.npm/_logs/*.log

      - name: Run tests for vite ${{ matrix.vite-version }}
        run: npm test
